<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuestionario: ¿Qué es la antimateria?</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            background-color: #f4f7f6;
            color: #333;
        }
        .quiz-container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 30px;
            font-style: italic;
        }
        .question {
            margin-bottom: 25px;
            padding: 20px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            background-color: #fafafa;
        }
        .question p {
            font-weight: bold;
            font-size: 1.1em;
            margin-top: 0;
            color: #2c3e50;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .option {
            padding: 12px 15px;
            border: 2px solid #dcdde1;
            border-radius: 6px;
            cursor: pointer;
            background-color: #ffffff;
            transition: all 0.2s ease;
            font-size: 1em;
        }
        .option:hover {
            background-color: #f1f2f6;
            border-color: #7f8fa6;
        }
        /* Clases para la corrección al pinchar */
        .option.correct {
            background-color: #4cd137 !important; /* Verde */
            color: white;
            border-color: #44bd32 !important;
        }
        .option.incorrect {
            background-color: #ff9f43 !important; /* Naranja */
            color: white;
            border-color: #ee5253 !important;
        }
        /* Desactivar opciones una vez contestadas */
        .option.disabled {
            pointer-events: none;
        }
        #submit-btn {
            display: block;
            width: 100%;
            padding: 15px;
            font-size: 1.1em;
            font-weight: bold;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 30px;
            transition: background-color 0.3s;
        }
        #submit-btn:hover {
            background-color: #2980b9;
        }
        #result {
            margin-top: 25px;
            padding: 20px;
            font-size: 1.2em;
            text-align: center;
            border-radius: 6px;
            display: none;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <h1>Cuestionario: El Misterio de la Antimateria</h1>
    <p class="subtitle">Basado en el vídeo "¿Qué es la antimateria?"</p>

    <div id="quiz"></div>

    <button id="submit-btn" onclick="showResults()">Ver Puntuación Final</button>
    <div id="result"></div>
</div>

<script>
    // Base de datos de preguntas y opciones
    const quizData = [
        {
            question: "1. ¿Para qué escribió Paul Dirac su famosa ecuación en 1928?",
            options: [
                { text: "Para unificar la gravedad con la mecánica cuántica.", isCorrect: false },
                { text: "Para describir el comportamiento de los electrones y protones conocidos entonces.", isCorrect: true },
                { text: "Para explicar por qué las estrellas brillan.", isCorrect: false },
                { text: "Para calcular la masa exacta de los fotones.", isCorrect: false }
            ]
        },
        {
            question: "2. ¿Qué teoría introdujo Albert Einstein que obligó a revisar cómo se describía la materia en la física?",
            options: [
                { text: "La teoría de cuerdas.", isCorrect: false },
                { text: "La termodinámica clásica.", isCorrect: false },
                { text: "La teoría de la relatividad.", isCorrect: true },
                { text: "El electromagnetismo de Maxwell.", isCorrect: false }
            ]
        },
        {
            question: "3. ¿Qué característica matemática particular tiene la ecuación de la energía de Einstein que fue clave para Dirac?",
            options: [
                { text: "Es una ecuación lineal sin incógnitas.", isCorrect: false },
                { text: "Es una ecuación exponencial.", isCorrect: false },
                { text: "Es una ecuación cuadrática (elevada al cuadrado), lo que permite dos soluciones.", isCorrect: true },
                { text: "Se basa puramente en logaritmos naturales.", isCorrect: false }
            ]
        },
        {
            question: "4. Al resolver su ecuación cuadrática, Dirac obtuvo dos soluciones. La primera era el electrón. ¿Qué representaba al principio la segunda solución para él?",
            options: [
                { text: "Materia ordinaria pero con energía negativa.", isCorrect: true },
                { text: "Un neutrón sin carga ni masa.", isCorrect: false },
                { text: "Un agujero negro a escala atómica.", isCorrect: false },
                { text: "Un fotón viajando hacia el pasado.", isCorrect: false }
            ]
        },
        {
            question: "5. ¿Cuál es la diferencia principal entre una partícula ordinaria y su antipartícula correspondiente?",
            options: [
                { text: "La antipartícula tiene la mitad de masa.", isCorrect: false },
                { text: "Son completamente simétricas pero tienen carga eléctrica contraria.", isCorrect: true },
                { text: "Giran a una velocidad mucho menor.", isCorrect: false },
                { text: "La antipartícula es invisible a los microscopios electrónicos.", isCorrect: false }
            ]
        },
        {
            question: "6. ¿Quién observó por primera vez en los rayos cósmicos una antipartícula (un electrón con signo contrario)?",
            options: [
                { text: "Galileo Galilei.", isCorrect: false },
                { text: "Erwin Schrödinger.", isCorrect: false },
                { text: "Carl Anderson.", isCorrect: true },
                { text: "Stephen Hawking.", isCorrect: false }
            ]
        },
        {
            question: "7. ¿Qué sucede exactamente cuando la materia entra en contacto directo con la antimateria?",
            options: [
                { text: "Se fusionan creando un elemento súper pesado.", isCorrect: false },
                { text: "Se repelen mutuamente por magnetismo.", isCorrect: false },
                { text: "Desaparecen aniquilándose en un estallido de energía.", isCorrect: true },
                { text: "Se congelan hasta alcanzar el cero absoluto.", isCorrect: false }
            ]
        },
        {
            question: "8. Según el vídeo, si juntáramos dos antihidrógenos y un antioxígeno, ¿qué obtendríamos?",
            options: [
                { text: "Antiagua, que se comportaría visual y físicamente igual que el agua normal.", isCorrect: true },
                { text: "Un gas altamente venenoso de color verde.", isCorrect: false },
                { text: "Una explosión incontrolable inmediata.", isCorrect: false },
                { text: "Materia oscura sólida.", isCorrect: false }
            ]
        },
        {
            question: "9. ¿En qué ámbitos se ha logrado producir o detectar antimateria en la vida real?",
            options: [
                { text: "Solo existe de forma teórica en los libros de matemáticas.", isCorrect: false },
                { text: "En rayos cósmicos, materiales radiactivos y en laboratorios controlados.", isCorrect: true },
                { text: "Únicamente en el núcleo de las estrellas supergigantes rojas.", isCorrect: false },
                { text: "En el fondo de los océanos, cerca de los volcanes.", isCorrect: false }
            ]
        },
        {
            question: "10. ¿Qué posible aplicación práctica de la antimateria en la medicina se menciona al final del vídeo?",
            options: [
                { text: "La creación de vacunas cuánticas contra virus.", isCorrect: false },
                { text: "Células madre inmortales.", isCorrect: false },
                { text: "La mejora de técnicas de tratamiento de cáncer, siendo menos destructiva para las células sanas.", isCorrect: true },
                { text: "Curar enfermedades genéticas alterando el ADN directamente.", isCorrect: false }
            ]
        }
    ];

    let score = 0;
    let answeredQuestions = 0;

    // Función para construir el cuestionario dinámicamente
    function buildQuiz() {
        const quizContainer = document.getElementById('quiz');
        quizData.forEach((q, qIndex) => {
            const questionDiv = document.createElement('div');
            questionDiv.classList.add('question');
            questionDiv.innerHTML = `<p>${q.question}</p>`;
            
            const optionsDiv = document.createElement('div');
            optionsDiv.classList.add('options');
            
            q.options.forEach((opt, oIndex) => {
                const optionDiv = document.createElement('div');
                optionDiv.classList.add('option');
                optionDiv.innerText = opt.text;
                // Al hacer clic, se llama a la función de selección
                optionDiv.onclick = () => selectOption(optionDiv, opt.isCorrect, qIndex);
                optionsDiv.appendChild(optionDiv);
            });
            
            questionDiv.appendChild(optionsDiv);
            quizContainer.appendChild(questionDiv);
        });
    }

    // Función que evalúa la opción pinchada
    function selectOption(selectedDiv, isCorrect, qIndex) {
        const optionsDiv = selectedDiv.parentElement;
        const allOptions = optionsDiv.querySelectorAll('.option');
        
        // Evitar que se responda más de una vez a la misma pregunta
        if (optionsDiv.classList.contains('answered')) return;
        
        optionsDiv.classList.add('answered');
        answeredQuestions++;

        // Desactivar todas las opciones de esta pregunta
        allOptions.forEach(opt => opt.classList.add('disabled'));

        if (isCorrect) {
            selectedDiv.classList.add('correct');
            score++;
        } else {
            selectedDiv.classList.add('incorrect');
            // Si falla, mostramos automáticamente cuál era la correcta en verde
            quizData[qIndex].options.forEach((opt, idx) => {
                if(opt.isCorrect) {
                    allOptions[idx].classList.add('correct');
                }
            });
        }
    }

    // Función para calcular y mostrar el resultado final
    function showResults() {
        if (answeredQuestions < quizData.length) {
            alert('Por favor, responde todas las preguntas pinchando en una opción antes de ver la puntuación final.');
            return;
        }

        const resultDiv = document.getElementById('result');
        resultDiv.style.display = 'block';
        
        let message = '';
        
        // Lógica de mensajes según puntuación
        if (score === 10) {
            message = '¡Nivel máximo! Eres todo un experto en la materia.';
            resultDiv.style.backgroundColor = '#d4edda';
            resultDiv.style.color = '#155724';
        } else if (score >= 7) {
            message = '¡Estupendo! Has prestado mucha atención a los detalles del vídeo.';
            resultDiv.style.backgroundColor = '#cce5ff';
            resultDiv.style.color = '#004085';
        } else if (score >= 5) {
            message = '¡Está bien! Aunque te recomendaría darle un repaso rápido para afianzar conceptos.';
            resultDiv.style.backgroundColor = '#fff3cd';
            resultDiv.style.color = '#856404';
        } else {
            message = 'Debes mejorar. Lo ideal sería volver a ver el vídeo con tranquilidad e intentarlo de nuevo.';
            resultDiv.style.backgroundColor = '#f8d7da';
            resultDiv.style.color = '#721c24';
        }

        resultDiv.innerHTML = `<strong>Puntuación conseguida: ${score} de 10</strong><br><br>${message}`;
        document.getElementById('submit-btn').style.display = 'none'; // Oculta el botón tras finalizar
    }

    // Inicializamos el cuestionario al cargar
    buildQuiz();
</script>
</body>
</html>
